name: Build alist module for iOS (OpenList backend)

# AList 已闭源（2025 收购争议），模块后端改用社区开源分支 OpenList（OpenListTeam/OpenList）。
# OpenList 官方 Release 没有 iOS 构建。GOOS=ios 硬性要求 cgo 外链
# （"ios/arm64 requires external (cgo) linking"），CGO_ENABLED=0 走不通——
# 所以 runner 用 macos-15（自带 Xcode/iPhoneOS SDK），CC 走
# xcrun -sdk iphoneos clang 交叉编译，产出 iOS 平台 Mach-O 后 codesign 伪签名。
# 前端照抄官方 FetchWebRelease：OpenList-Frontend latest 的
# openlist-frontend-dist-*.tar.gz 平铺解压进 public/dist（public.go //go:embed all:dist）。
#
# v0.3.90 修复同步（来源：EscapeOS 仓库 sapbridge/，2026-09-02 排查定论）：
# 1. bridge 用 EscapeOS 的 openlist.go（数据目录参数传入 + 服务逻辑跑真 goroutine
#    防爆栈 + --debug --log-std + 绝不 os.Exit + admin/memtest/probe 等诊断导出），
#    替代旧的内联 echo 版本（env 传数据目录不可见 + 深调用爆栈两大根因已修）
# 2. -tags "sqlite_cgo_compat"：sqlite 驱动从 glebarez（modernc 纯 Go 转译，iOS/LC
#    沙箱 InitDB 原生崩溃）切换为 gorm.io/driver/sqlite（mattn cgo 真 C sqlite3）
# 3. patch_stages.py：bootstrap/db 各函数注入 begin/done 阶段标记（写入模块数据目录
#    temp/，宿主 SSH mlog 可读），崩溃可函数级定位
# 4. go get gorm.io/driver/sqlite：cgo 驱动依赖（mattn/go-sqlite3 随之引入）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: false

      - name: Install ldid
        run: |
          which ldid || brew install ldid
          ldid -V || true

      - name: Build OpenList dylib (iOS arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/OpenListTeam/OpenList.git _openlist
          cd _openlist
          # 前端资源：照抄官方 FetchWebRelease——openlist-frontend-dist-*.tar.gz 平铺解压进 public/dist
          # 用 gh api（带 GITHUB_TOKEN 认证）——macos runner 未认证 IP 常被限流，jq 会拿到 null
          frontendTar=$(gh api repos/OpenListTeam/OpenList-Frontend/releases/latest \
            -q '.assets[].browser_download_url' \
            | grep "openlist-frontend-dist" | grep -v "lite" | grep "\.tar\.gz$" | head -1)
          [ -n "$frontendTar" ] || { echo "❌ 未找到 openlist-frontend-dist 资产"; exit 1; }
          echo "frontend: $frontendTar"
          curl -fsSL "$frontendTar" -o dist.tar.gz
          rm -rf public/dist && mkdir -p public/dist
          tar -zxf dist.tar.gz -C public/dist
          rm -f dist.tar.gz
          webVersion=$(basename "$frontendTar" | sed 's/openlist-frontend-dist-//;s/\.tar\.gz$//')
          ver=$(python3 -c "import json;print(json.load(open('../modules/com.escapeos.alist/module.json',encoding='utf-8'))['version'])")
          echo "openlist module version: $ver, frontend: $webVersion"

          # v0.3.90：bridge 改用 EscapeOS 仓库的最新实现（数据目录参数传入 + goroutine
          # 防爆栈 + --debug --log-std + 绝不 os.Exit + 诊断导出），替代旧内联 echo 版本
          curl -fsSL "https://raw.githubusercontent.com/AmorCool/EscapeOS/migrate-xcode/sapbridge/openlist.go" \
            -o bridge_ios.go
          [ -s bridge_ios.go ] || { echo "❌ bridge_ios.go 拉取失败"; exit 1; }
          grep -q "openlist_embed" bridge_ios.go || { echo "❌ bridge_ios.go 内容异常"; exit 1; }

          # 崩溃定位标记：bootstrap/db 各函数注入 begin/done（写入模块数据目录 temp/）
          curl -fsSL "https://raw.githubusercontent.com/AmorCool/EscapeOS/migrate-xcode/sapbridge/patch_stages.py" \
            -o patch_stages.py
          [ -s patch_stages.py ] && python3 patch_stages.py . || echo "?? 标记注入失败（继续未打标记构建）"
          "$(command -v gofmt || echo gofmt)" -w internal/bootstrap internal/db 2>/dev/null || true

          # cgo sqlite 驱动依赖（-tags sqlite_cgo_compat 引用 gorm.io/driver/sqlite → mattn）
          go get gorm.io/driver/sqlite 2>&1 | tail -1 || true
          go mod tidy 2>&1 | tail -1 || true

          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="xcrun -sdk iphoneos clang" \
            go build -buildmode=c-archive \
              -tags "openlist_embed,sqlite_cgo_compat,jsoniter" \
              -o libopenlist.a \
              -ldflags="-s -w -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$ver' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=$webVersion'" \
              .
          SDK=$(xcrun -sdk iphoneos -show-sdk-path)
          # -force_load 必须：否则链接器不抽取任何归档成员（无未定义符号引用），dylib 为空壳
          # 框架/lresolv 清单 = gomobile ios 同款（Security: Sec*；lresolv: res_9_*）
          xcrun -sdk iphoneos clang -dynamiclib -isysroot "$SDK" \
            -framework Foundation -framework CoreFoundation \
            -framework Security -framework CFNetwork -framework SystemConfiguration \
            -framework UIKit -framework MobileCoreServices \
            -lresolv \
            -Wl,-force_load,"$PWD/libopenlist.a" \
            -Wl,-install_name,"@rpath/openlist.dylib" \
            -o ../modules/com.escapeos.alist/bin/openlist.dylib libopenlist.a
          xcrun -sdk iphoneos strip -x ../modules/com.escapeos.alist/bin/openlist.dylib || true
          # dylib 用 Apple 官方 codesign 伪签名（ldid 对 138MB Go 特殊 dylib 签名曾被设备判 invalid）
          codesign --force --sign - ../modules/com.escapeos.alist/bin/openlist.dylib
          codesign --verify --strict ../modules/com.escapeos.alist/bin/openlist.dylib && echo "✅ dylib 签名自检通过"
          cd ..
          codesign -v --strict modules/com.escapeos.alist/bin/openlist.dylib && echo "✅ dylib 签名终检通过"
          file modules/com.escapeos.alist/bin/openlist.dylib
          ls -la modules/com.escapeos.alist/bin/

      - name: Sign module manifest (official ed25519)
        env:
          HOTFIX_PRIVATE_KEY: ${{ secrets.HOTFIX_PRIVATE_KEY }}
        run: |
          set -e
          # -rawin（ed25519 必需）是 OpenSSL 3.0+ 选项；macos runner PATH 里是 1.1.1w，
          # 也不支持。所以：系统是 3.x 就用系统的，否则找 brew openssl@3，没有就装。
          OPENSSL=""
          if openssl version 2>/dev/null | grep -q "^OpenSSL 3"; then
            OPENSSL=openssl
          else
            for p in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl; do
              [ -x "$p" ] && OPENSSL="$p" && break
            done
            if [ -z "$OPENSSL" ]; then
              brew install openssl@3
              OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
            fi
          fi
          echo "using: $OPENSSL"; $OPENSSL version
          echo "$HOTFIX_PRIVATE_KEY" > /tmp/hotfix_key.pem
          chmod 600 /tmp/hotfix_key.pem
          $OPENSSL pkeyutl -sign -inkey /tmp/hotfix_key.pem -rawin \
            -in modules/com.escapeos.alist/module.json -out sig.bin
          # macOS BSD base64 无 -w：用 openssl base64 -A 保证单行输出
          $OPENSSL base64 -A -in sig.bin -out modules/com.escapeos.alist/signature.sig
          rm -f sig.bin
          echo "✍ manifest 已签名"

      - name: Package module zip
        run: |
          mkdir -p dist
          ver=$(python3 -c "import json;print(json.load(open('modules/com.escapeos.alist/module.json',encoding='utf-8'))['version'])")
          zip -r "dist/com.escapeos.alist-v${ver}.zip" modules/com.escapeos.alist -x '*/data/*' '*/run.log'
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alist-ios
          path: dist/*.zip

      - name: Publish to edge release (clobber)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload edge dist/*.zip --clobber -R "$GITHUB_REPOSITORY"
