name: Build alist for iOS

# alist 官方 Release 没有 iOS 构建——用 Go 交叉编译 GOOS=ios GOARCH=arm64
# （CGO_ENABLED=0 纯静态），产物为 Mach-O；真机运行需 ldid 伪签名
# （LC 环境可直接跑，原生机型需自签/签名工具处理）。
# 前端照抄官方 FetchWebRelease：dist.tar.gz 解压顶层 dist/ → public/dist
# （public.go 里 //go:embed all:dist；go.mod 要求 go >= 1.25）。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install ldid
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ldid || {
            curl -sL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /usr/local/bin/ldid
            chmod +x /usr/local/bin/ldid
          }

      - name: Build alist (iOS arm64)
        run: |
          git clone --depth 1 https://github.com/AlistGo/alist.git _alist
          cd _alist
          # 前端资源：照抄官方 FetchWebRelease——顶层 dist/ 移到 public/dist（//go:embed all:dist）
          curl -sL https://github.com/alist-org/alist-web/releases/latest/download/dist.tar.gz -o dist.tar.gz
          tar -zxf dist.tar.gz
          rm -rf public/dist
          mv -f dist public
          rm -f dist.tar.gz
          webVersion=$(curl -sL -t1 -T2 "https://api.github.com/repos/alist-org/alist-web/releases/latest" | grep '"tag_name"' | head -n 1 | awk -F ':' '{print $2}' | sed 's/"//g;s/,//g;s/ //g')
          ver=$(python3 -c "import json;print(json.load(open('../modules/com.escapeos.alist/module.json',encoding='utf-8'))['version'])")
          echo "alist backend: $ver, frontend: $webVersion"
          CGO_ENABLED=0 GOOS=ios GOARCH=arm64 go build \
            -o ../modules/com.escapeos.alist/bin/alist \
            -ldflags="-s -w -X 'github.com/alist-org/alist/v3/internal/conf.Version=$ver' -X 'github.com/alist-org/alist/v3/internal/conf.WebVersion=$webVersion'" \
            -tags=jsoniter .
          cd ..
          file modules/com.escapeos.alist/bin/alist
          ls -la modules/com.escapeos.alist/bin/

      - name: Fake-sign (ldid)
        run: ldid -S modules/com.escapeos.alist/bin/alist

      - name: Sign module manifest (official ed25519)
        env:
          HOTFIX_PRIVATE_KEY: ${{ secrets.HOTFIX_PRIVATE_KEY }}
        run: |
          set -e
          echo "$HOTFIX_PRIVATE_KEY" > /tmp/hotfix_key.pem
          chmod 600 /tmp/hotfix_key.pem
          openssl pkeyutl -sign -inkey /tmp/hotfix_key.pem -rawin \
            -in modules/com.escapeos.alist/module.json -out sig.bin
          base64 -w0 sig.bin > modules/com.escapeos.alist/signature.sig
          rm -f sig.bin
          echo "✍ manifest 已签名"

      - name: Package module zip
        run: |
          mkdir -p dist
          ver=$(python3 -c "import json;print(json.load(open('modules/com.escapeos.alist/module.json',encoding='utf-8'))['version'])")
          zip -r "dist/com.escapeos.alist-v${ver}.zip" modules/com.escapeos.alist -x '*/data/*' '*/run.log'
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alist-ios
          path: dist/*.zip

      - name: Publish to edge release (clobber)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload edge dist/*.zip --clobber -R "$GITHUB_REPOSITORY"
