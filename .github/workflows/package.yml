name: Package Modules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1) 签名：含 binary / hotfix 的模块必须带 signature.sig
      #    判定用 python 解析 JSON，不用 grep 文本匹配（避免子串误判）
      #    签名 = ed25519 对 module.json 原文字节签名，输出单行 base64
      # ------------------------------------------------------------------
      - name: Sign hotfix/binary modules (official ed25519)
        env:
          HOTFIX_PRIVATE_KEY: ${{ secrets.HOTFIX_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$HOTFIX_PRIVATE_KEY" ]; then
            echo "❌ 未配置 HOTFIX_PRIVATE_KEY secret"
            echo "含 binary/hotfix 的模块无法签名，宿主会拒绝导入——终止构建。"
            exit 1
          fi
          echo "$HOTFIX_PRIVATE_KEY" > /tmp/hotfix_key.pem
          chmod 600 /tmp/hotfix_key.pem
          openssl pkey -in /tmp/hotfix_key.pem -noout && echo "私钥加载 OK"
          # 从私钥导出公钥，用于签完立刻自校验（宿主内置的是同一对）
          openssl pkey -in /tmp/hotfix_key.pem -pubout -out /tmp/hotfix_pub.pem

          signed=0
          for dir in modules/*/; do
            id=$(basename "$dir")
            # 单行 python（多行会破坏 YAML 块标量缩进）
            needs=$(python3 -c "import json;m=json.load(open('$dir/module.json',encoding='utf-8'));print('yes' if ('binary' in m or 'hotfix' in m) else 'no')" || echo no)
            if [ "$needs" != "yes" ]; then
              echo "· $id 无需签名"
              continue
            fi
            openssl pkeyutl -sign -inkey /tmp/hotfix_key.pem -rawin \
              -in "$dir/module.json" -out /tmp/sig.bin
            base64 -w0 /tmp/sig.bin > "$dir/signature.sig"
            # 立刻用公钥验一遍，避免「签了但宿主验不过」
            openssl pkeyutl -verify -pubin -inkey /tmp/hotfix_pub.pem -rawin \
              -in "$dir/module.json" -sigfile /tmp/sig.bin >/dev/null
            echo "✍ $id 已签名并自校验通过"
            signed=$((signed+1))
          done
          echo "共签名 $signed 个模块"

      # ------------------------------------------------------------------
      # 2) 校验：validate.py 与宿主实现逐条对齐（含 signature.sig 检查）
      # ------------------------------------------------------------------
      - name: Validate module manifests
        run: |
          fail=0
          for dir in modules/*/; do
            id=$(basename "$dir")
            echo "── $id"
            if python3 validate.py "$dir/module.json"; then
              echo "OK $id"
            else
              echo "FAIL $id"
              fail=1
            fi
          done
          exit $fail

      # ------------------------------------------------------------------
      # 3) 打包：每个模块一个 zip，根目录是 <id>/
      #    com.escapeos.alist 由 build-alist.yml 构建（含 138MB dylib），此处跳过
      #    ⚠️ signature.sig 必须留在 zip 里，宿主导入时要验
      # ------------------------------------------------------------------
      - name: Package each module into .zip
        run: |
          set -e
          mkdir -p dist
          for dir in modules/*/; do
            id=$(basename "$dir")
            if [ "$id" = "com.escapeos.alist" ]; then
              echo "跳过 $id（由 build-alist.yml 构建发布）"
              continue
            fi
            ver=$(python3 -c "import json;print(json.load(open('$dir/module.json',encoding='utf-8'))['version'])")
            zip -r "dist/${id}-v${ver}.zip" "$dir" -x '*/.*' '*/data/*' '*/run.log'
            echo "打包: ${id}-v${ver}.zip"
          done
          ls -la dist/

      - name: Verify zip contents
        run: |
          set -e
          for z in dist/*.zip; do
            echo "── $z"
            unzip -l "$z" | grep -qE 'module\.json$' || { echo "❌ $z 内没有 module.json"; exit 1; }
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modules
          path: dist/*.zip

      - name: Release (edge)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: "模块构建 (edge)"
          files: dist/*.zip
          allowUpdates: true
          prerelease: true
