name: Package Modules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate module manifests
        run: |
          fail=0
          for dir in modules/*/; do
            id=$(basename "$dir")
            if python3 validate.py "$dir/module.json"; then
              echo "OK $id"
            else
              echo "FAIL $id"
              fail=1
            fi
          done
          exit $fail

      - name: Package each module into .zip
        run: |
          mkdir -p dist
          for dir in modules/*/; do
            id=$(basename "$dir")
            ver=$(python3 -c "import json;print(json.load(open('$dir/module.json',encoding='utf-8'))['version'])")
            zip -r "dist/${id}-v${ver}.zip" "$dir" -x '*/.*'
            echo "打包: ${id}-v${ver}.zip"
          done
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modules
          path: dist/*.zip

      - name: Release (edge)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: "模块构建 (edge)"
          files: dist/*.zip
          allowUpdates: true
          prerelease: true
